<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة الذكية للعمر</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 25px;
        }
        .container {
            width: 100%;
            max-width: 430px;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lbl-title {
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #38bdf8, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            text-align: center;
        }
        .frame-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }
        .sub-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            background-color: #1e293b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .sub-frame:nth-child(1) { border-top: 3px solid #10b981; } /* Day - Emerald */
        .sub-frame:nth-child(2) { border-top: 3px solid #a855f7; } /* Month - Purple */
        .sub-frame:nth-child(3) { border-top: 3px solid #0ea5e9; } /* Year - Sky Blue */

        .sub-frame label {
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .sub-frame input {
            width: 100%;
            padding: 6px;
            font-size: 16px;
            text-align: center;
            background-color: #0f172a;
            border: 2px solid #475569;
            color: #ffffff;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }
        .sub-frame:nth-child(1) input:focus { border-color: #10b981; }
        .sub-frame:nth-child(2) input:focus { border-color: #a855f7; }
        .sub-frame:nth-child(3) input:focus { border-color: #0ea5e9; }

        .btn-calc {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            transition: transform 0.2s;
        }
        .btn-calc:active {
            transform: scale(0.98);
        }
        .frame-results {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            text-align: center;
            padding: 12px 5px;
        }
        .card:nth-child(1) { border-bottom: 3px solid #10b981; } /* Days */
        .card:nth-child(2) { border-bottom: 3px solid #a855f7; } /* Months */
        .card:nth-child(3) { border-bottom: 3px solid #0ea5e9; } /* Years */

        .card-val {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card:nth-child(1) .card-val { color: #10b981; }
        .card:nth-child(2) .card-val { color: #a855f7; }
        .card:nth-child(3) .card-val { color: #0ea5e9; }

        .card-lbl {
            font-size: 12px;
            color: #94a3b8;
        }
        .card-total, .card-extra {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            padding: 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .card-total { border-right: 4px solid #facc15; }
        .card-extra { border-right: 4px solid #ec4899; }

        .card-total-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .card-total-val {
            font-size: 16px;
            font-weight: bold;
            color: #facc15;
        }
        .card-extra-val {
            font-size: 13px;
            color: #ec4899;
            line-height: 1.6;
            white-space: pre-line;
        }
        .birthday-glow {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            border: 2px solid #ec4899 !important;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
            animation: glow 1.5s infinite alternate;
            color: #f472b6 !important;
            font-weight: bold;
        }
        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(236, 72, 153, 0.3); }
            to { box-shadow: 0 0 20px rgba(236, 72, 153, 0.8); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lbl-title">أحسب عمرك بدقة - المطور عبدالقادر</div>
        
        <div class="frame-inputs">
            <div class="sub-frame">
                <label>اليوم</label>
                <input type="number" id="entry_day" placeholder="DD">
            </div>
            <div class="sub-frame">
                <label>الشهر</label>
                <input type="number" id="entry_month" placeholder="MM">
            </div>
            <div class="sub-frame">
                <label>السنة</label>
                <input type="number" id="entry_year" placeholder="YYYY">
            </div>
        </div>

        <button class="btn-calc" onclick="calculateAge()">أبدء الحساب</button>

        <div class="frame-results">
            <div class="card">
                <div class="card-val" id="lbl_days_val">-</div>
                <div class="card-lbl">أيام</div>
            </div>
            <div class="card">
                <div class="card-val" id="lbl_months_val">-</div>
                <div class="card-lbl">أشهر</div>
            </div>
            <div class="card">
                <div class="card-val" id="lbl_years_val">-</div>
                <div class="card-lbl">سنوات</div>
            </div>
        </div>

        <div class="card-total">
            <div class="card-total-title">عدد الأيام الكلي لعمرك هو:</div>
            <div class="card-total-val" id="lbl_total_days_val">-</div>
        </div>

        <div class="card-extra" id="card_extra_container">
            <div class="card-extra-val" id="lbl_extra_val">-</div>
        </div>
    </div>

    <script>
        function monthrange(year, month) {
            const lastDay = new Date(year, month, 0).getDate();
            return [0, lastDay];
        }

        function launchConfetti() {
            const colors = ['#ff79c6', '#38bdf8', '#c084fc', '#34d399', '#facc15', '#fb7185'];
            for (let i = 0; i < 70; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = Math.random() * 8 + 6 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.top = '-10px';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.opacity = Math.random() * 0.8 + 0.2;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.zIndex = '9999';
                confetti.style.pointerEvents = 'none';
                document.body.appendChild(confetti);

                const duration = Math.random() * 3 + 2;
                const xMovement = (Math.random() - 0.5) * 200;

                confetti.style.transition = `transform ${duration}s ease-in, top ${duration}s linear, opacity ${duration}s ease-in`;
                
                setTimeout(() => {
                    confetti.style.top = window.innerHeight + 50 + 'px';
                    confetti.style.transform = `translateX(${xMovement}px) rotate(${Math.random() * 720}deg)`;
                    confetti.style.opacity = '0';
                }, 50);

                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000 + 100);
            }
        }

        function calculateAge() {
            try {
                const day = parseInt(document.getElementById('entry_day').value);
                const month = parseInt(document.getElementById('entry_month').value);
                const year = parseInt(document.getElementById('entry_year').value);

                if (isNaN(day) || isNaN(month) || isNaN(year)) {
                    alert("الرجاء إدخال تواريخ صحيحة.");
                    return;
                }

                const date_then = new Date(year, month - 1, day);
                const date_now = new Date();

                date_then.setHours(0, 0, 0, 0);
                date_now.setHours(0, 0, 0, 0);

                if (date_then > date_now) {
                    alert("تاريخ الميلاد لا يمكن أن يكون في المستقبل!");
                    return;
                }

                const deltaDays = Math.round((date_now - date_then) / (1000 * 60 * 60 * 24));
                
                let years = date_now.getFullYear() - date_then.getFullYear();
                let months = date_now.getMonth() - date_then.getMonth();
                let days = date_now.getDate() - date_then.getDate();

                if (days < 0) {
                    const previous_month = date_now.getMonth() === 0 ? 12 : date_now.getMonth();
                    const previous_year = date_now.getMonth() === 0 ? date_now.getFullYear() - 1 : date_now.getFullYear();
                    const [, days_in_prev_month] = monthrange(previous_year, previous_month);
                    days += days_in_prev_month;
                    months -= 1;
                }

                if (months < 0) {
                    months += 12;
                    years -= 1;
                }

                document.getElementById('lbl_years_val').innerText = years;
                document.getElementById('lbl_months_val').innerText = months;
                document.getElementById('lbl_days_val').innerText = days;
                document.getElementById('lbl_total_days_val').innerText = deltaDays.toLocaleString() + " يوم";

                const days_ar = ["الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت", "الأحد"];
                const jsDay = date_then.getDay();
                let py_weekday = jsDay === 0 ? 6 : jsDay - 1;
                const birth_day_name = days_ar[py_weekday];

                const extraContainer = document.getElementById('card_extra_container');
                const extraVal = document.getElementById('lbl_extra_val');

                // Check if today is user's birthday
                const isBirthday = (date_now.getDate() === day && (date_now.getMonth() + 1) === month);

                if (isBirthday) {
                    extraContainer.classList.add('birthday-glow');
                    extraVal.innerHTML = "عَسَى يَوم مِيلادك يمرّ بأَلْفِ عَام<br>كُلُّ عَام وَأنت أَجمل من يكْبَر🎂🎉";
                    launchConfetti();
                } else {
                    extraContainer.classList.remove('birthday-glow');
                    let next_birthday;
                    try {
                        next_birthday = new Date(date_now.getFullYear(), date_then.getMonth(), date_then.getDate());
                    } catch(e) {
                        next_birthday = new Date(date_now.getFullYear(), 2, 1);
                    }

                    if (next_birthday < date_now) {
                        try {
                            next_birthday = new Date(date_now.getFullYear() + 1, date_then.getMonth(), date_then.getDate());
                        } catch(e) {
                            next_birthday = new Date(date_now.getFullYear() + 1, 2, 1);
                        }
                    }

                    const days_left = Math.round((next_birthday - date_now) / (1000 * 60 * 60 * 24));
                    extraVal.innerText = `يوم ميلادك هو: ${birth_day_name}\nباقي ليوم ميلادك: ${days_left} يوم`;
                }

            } catch (e) {
                alert("الرجاء إدخال أرقام صحيحة.");
            }
        }
    </script>
</body>
</html>
