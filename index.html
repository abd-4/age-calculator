<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة الذكية للعمر</title>
    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
            overflow-x: hidden;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        .container {
            width: 100%;
            max-width: 430px;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }
        .lbl-title {
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(90deg, #38bdf8, #c084fc, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 22px;
            text-align: center;
        }
        .frame-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }
        .sub-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            background: rgba(31, 41, 55, 0.7);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        .sub-frame:nth-child(1) { border-top: 3px solid #38bdf8; }
        .sub-frame:nth-child(2) { border-top: 3px solid #c084fc; }
        .sub-frame:nth-child(3) { border-top: 3px solid #fbbf24; }
        
        .sub-frame label {
            font-size: 13px;
            font-weight: bold;
            color: #e5e7eb;
            margin-bottom: 6px;
        }
        .sub-frame input {
            width: 100%;
            padding: 6px;
            font-size: 16px;
            text-align: center;
            background-color: #111827;
            border: 2px solid #4b5563;
            color: #ffffff;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }
        .sub-frame input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .btn-calc {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            transition: transform 0.1s ease;
        }
        .btn-calc:active {
            transform: scale(0.98);
        }
        .frame-results {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 12px;
        }
        .card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            text-align: center;
            padding: 12px 5px;
        }
        .card:nth-child(1) { border-bottom: 3px solid #38bdf8; }
        .card:nth-child(2) { border-bottom: 3px solid #c084fc; }
        .card:nth-child(3) { border-bottom: 3px solid #fbbf24; }

        .card-val {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 4px;
        }
        .card:nth-child(2) .card-val { color: #c084fc; }
        .card:nth-child(3) .card-val { color: #fbbf24; }

        .card-lbl {
            font-size: 12px;
            color: #9ca3af;
        }
        .card-total, .card-extra {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            padding: 12px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .card-total { border-right: 4px solid #34d399; }
        .card-total-title {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .card-total-val {
            font-size: 16px;
            font-weight: bold;
            color: #34d399;
        }
        .card-extra { border-right: 4px solid #f43f5e; }
        .card-extra-val {
            font-size: 13px;
            color: #f43f5e;
            line-height: 1.6;
            white-space: pre-line;
        }
        .birthday-glow {
            color: #fbbf24 !important;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.6), 0 0 20px rgba(244, 63, 94, 0.4);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            from { transform: scale(1); text-shadow: 0 0 10px rgba(251, 191, 36, 0.6); }
            to { transform: scale(1.02); text-shadow: 0 0 20px rgba(251, 191, 36, 0.9), 0 0 30px rgba(244, 63, 94, 0.8); }
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div class="container">
        <div class="lbl-title">أحسب عمرك بدقة - المطور عبدالقادر</div>
        
        <!-- حقول الإدخال مرتبة من اليمين: يوم، شهر، سنة -->
        <div class="frame-inputs">
            <div class="sub-frame">
                <label>اليوم</label>
                <input type="number" id="entry_day" placeholder="DD">
            </div>
            <div class="sub-frame">
                <label>الشهر</label>
                <input type="number" id="entry_month" placeholder="MM">
            </div>
            <div class="sub-frame">
                <label>السنة</label>
                <input type="number" id="entry_year" placeholder="YYYY">
            </div>
        </div>

        <button class="btn-calc" onclick="calculateAge()">أبدء الحساب</button>

        <!-- خانات العرض مرتبة من اليمين: أيام، أشهر، سنوات -->
        <div class="frame-results">
            <div class="card">
                <div class="card-val" id="lbl_days_val">-</div>
                <div class="card-lbl">أيام</div>
            </div>
            <div class="card">
                <div class="card-val" id="lbl_months_val">-</div>
                <div class="card-lbl">أشهر</div>
            </div>
            <div class="card">
                <div class="card-val" id="lbl_years_val">-</div>
                <div class="card-lbl">سنوات</div>
            </div>
        </div>

        <div class="card-total">
            <div class="card-total-title">عدد الأيام الكلي لعمرك هو:</div>
            <div class="card-total-val" id="lbl_total_days_val">-</div>
        </div>

        <div class="card-extra">
            <div class="card-extra-val" id="lbl_extra_val">-</div>
        </div>
    </div>

    <script>
        function monthrange(year, month) {
            const lastDay = new Date(year, month, 0).getDate();
            return [0, lastDay];
        }

        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            let particles = [];
            const colors = ['#38bdf8', '#fbbf24', '#f43f5e', '#a855f7', '#34d399', '#facc15'];
            
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotationSpeed;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                    
                    if (p.y > canvas.height) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function calculateAge() {
            try {
                const day = parseInt(document.getElementById('entry_day').value);
                const month = parseInt(document.getElementById('entry_month').value);
                const year = parseInt(document.getElementById('entry_year').value);

                if (isNaN(day) || isNaN(month) || isNaN(year)) {
                    alert("الرجاء إدخال تواريخ صحيحة.");
                    return;
                }

                const date_then = new Date(year, month - 1, day);
                const date_now = new Date();

                date_then.setHours(0, 0, 0, 0);
                date_now.setHours(0, 0, 0, 0);

                if (date_then > date_now) {
                    alert("تاريخ الميلاد لا يمكن أن يكون في المستقبل!");
                    return;
                }

                const deltaDays = Math.round((date_now - date_then) / (1000 * 60 * 60 * 24));
                
                let years = date_now.getFullYear() - date_then.getFullYear();
                let months = date_now.getMonth() - date_then.getMonth();
                let days = date_now.getDate() - date_then.getDate();

                if (days < 0) {
                    const previous_month = date_now.getMonth() === 0 ? 12 : date_now.getMonth();
                    const previous_year = date_now.getMonth() === 0 ? date_now.getFullYear() - 1 : date_now.getFullYear();
                    const [, days_in_prev_month] = monthrange(previous_year, previous_month);
                    days += days_in_prev_month;
                    months -= 1;
                }

                if (months < 0) {
                    months += 12;
                    years -= 1;
                }

                document.getElementById('lbl_years_val').innerText = years;
                document.getElementById('lbl_months_val').innerText = months;
                document.getElementById('lbl_days_val').innerText = days;
                document.getElementById('lbl_total_days_val').innerText = deltaDays.toLocaleString() + " يوم";

                const days_ar = ["الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت", "الأحد"];
                const jsDay = date_then.getDay();
                let py_weekday = jsDay === 0 ? 6 : jsDay - 1;
                const birth_day_name = days_ar[py_weekday];

                let next_birthday;
                try {
                    next_birthday = new Date(date_now.getFullYear(), date_then.getMonth(), date_then.getDate());
                } catch(e) {
                    next_birthday = new Date(date_now.getFullYear(), 2, 1);
                }

                if (next_birthday < date_now) {
                    try {
                        next_birthday = new Date(date_now.getFullYear() + 1, date_then.getMonth(), date_then.getDate());
                    } catch(e) {
                        next_birthday = new Date(date_now.getFullYear() + 1, 2, 1);
                    }
                }

                const days_left = Math.round((next_birthday - date_now) / (1000 * 60 * 60 * 24));

                let extraText = `يوم ميلادك هو: ${birth_day_name}\nباقي ليوم ميلادك: ${days_left} يوم`;

                // التحقق مما إذا كان اليوم هو عيد ميلاد المستخدم
                const isBirthday = (date_now.getDate() === date_then.getDate()) && (date_now.getMonth() === date_then.getMonth());
                
                const extraValElem = document.getElementById('lbl_extra_val');
                if (isBirthday) {
                    launchConfetti();
                    extraValElem.className = "card-extra-val birthday-glow";
                    extraText += `\n\nعَسَى يَوم مِيلادك يمرّ بأَلْفِ عَام\nكُلُّ عَام وَأنت أَجمل من يكْبَر🎂🎉`;
                } else {
                    extraValElem.className = "card-extra-val";
                }

                extraValElem.innerText = extraText;

            } catch (e) {
                alert("الرجاء إدخال أرقام صحيحة.");
            }
        }
    </script>
</body>
</html>
